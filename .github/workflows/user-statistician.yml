name: user-statistician

on:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 03:00 UTC
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate the GitHub user stats image
        uses: cicirello/user-statistician@v2
        with:
          image-file: github-user-stats.svg
          include-title: true
          colors: light
          category-order: general, repositories, contributions, languages
          commit-and-push: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stats to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          keep_history: true
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
